name: Import Vibe.now v0.2 once

on:
  push:
    branches:
      - tmp/v0.2-import-carrier
    paths:
      - ".github/workflows/import-v0.2-once.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout carrier branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail

          declare -A EXPECTED_BLOBS=(
            [build-inputs/v0.2/patch.part.00]=e9b116e1f9c716d39172f5b8594ba445a9cba491
            [build-inputs/v0.2/patch.part.01]=d8161ef40339419c8eda0c409c86e31fd568483d
            [build-inputs/v0.2/patch.part.02.00]=ec86d947244bab27846552ba64c78eb24ba2b88e
            [build-inputs/v0.2/patch.part.02.01]=cbac86e6449b2a9c213e6060b29af909dcbeca23
            [build-inputs/v0.2/patch.part.02.02]=48bba42f102a21cd1d3ba02afa76eca01b63387d
            [build-inputs/v0.2/patch.part.02.03]=c9559c2bdebf0ebb859e3903ee16c4cb5a0bb71d
            [build-inputs/v0.2/patch.part.02.04]=243688d8f43218b743d5391a9e8b67a92caa0919
            [build-inputs/v0.2/patch.part.02.05]=caa7502837d9fc5c5597a0c872952bce6e71aab9
            [build-inputs/v0.2/patch.part.03]=60dbd0c4bcc75fe62a9797407ffe3518ebeee40a
          )

          for path in "${!EXPECTED_BLOBS[@]}"; do
            test -f "$path"
            test "$(git hash-object "$path")" = "${EXPECTED_BLOBS[$path]}"
          done

          cat \
            build-inputs/v0.2/patch.part.00 \
            build-inputs/v0.2/patch.part.01 \
            build-inputs/v0.2/patch.part.02.00 \
            build-inputs/v0.2/patch.part.02.01 \
            build-inputs/v0.2/patch.part.02.02 \
            build-inputs/v0.2/patch.part.02.03 \
            build-inputs/v0.2/patch.part.02.04 \
            build-inputs/v0.2/patch.part.02.05 \
            build-inputs/v0.2/patch.part.03 \
            | base64 --decode > /tmp/vibenow-v0.2.patch.xz

          echo "eb18478e08f133e5711cf73aab520f900cac53c2a879506bfe789ff73d5a9164  /tmp/vibenow-v0.2.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/vibenow-v0.2.patch.xz > /tmp/vibenow-v0.2.patch

      - name: Apply patch onto clean feature branch
        shell: bash
        run: |
          set -euo pipefail
          FEATURE_BRANCH="feat/vibe-now-controls-overlay-v0.2"
          EXPECTED_BASE="2828bcdce4833877f2845f766e095b4562fb6e18"

          git fetch origin "refs/heads/${FEATURE_BRANCH}"
          ACTUAL_BASE="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL_BASE" = "$EXPECTED_BASE"
          git checkout --detach "$ACTUAL_BASE"

          git apply \
            --index \
            --whitespace=error-all \
            --exclude=.github/workflows/archive-source-once.yml \
            /tmp/vibenow-v0.2.patch

          test "$(git diff --cached --name-only | wc -l)" -eq 42
          grep -q '<string name="app_name">Vibe.now</string>' android/app/src/main/res/values/strings.xml
          grep -q '<string name="app_name">Vibe.now</string>' android/app/src/main/res/values-ja/strings.xml
          grep -q '<string>Vibe.now</string>' ios/SetLogCamera/Resources/Info.plist
          grep -q 'versionName = "0.2.0"' android/app/build.gradle.kts
          grep -q 'MARKETING_VERSION = 0.2.0' ios/SetLogCamera.xcodeproj/project.pbxproj

          if grep -R -E 'VolumeChord|bothVolumeKeys|chordDetector' android/app/src/main ios/SetLogCamera; then
            echo "Legacy simultaneous-volume shortcut remains" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import xml.etree.ElementTree as ET

          for path in Path('android/app/src/main/res').glob('values*/strings.xml'):
              ET.parse(path)
          for path in (
              Path('ios/SetLogCamera/Resources/Info.plist'),
              Path('ios/SetLogCamera/Resources/PrivacyInfo.xcprivacy'),
          ):
              with path.open('rb') as handle:
                  plistlib.load(handle)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: improve Vibe.now controls, camera switching, gallery, and timestamps"
          git push \
            --force-with-lease="refs/heads/${FEATURE_BRANCH}:${EXPECTED_BASE}" \
            origin "HEAD:refs/heads/${FEATURE_BRANCH}"
