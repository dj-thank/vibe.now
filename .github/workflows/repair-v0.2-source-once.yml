name: Repair Vibe.now v0.2 source once

on:
  push:
    branches:
      - tmp/v0.2-import-carrier
    paths:
      - ".github/workflows/repair-v0.2-source-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused compiler fixes
        shell: bash
        run: |
          set -euo pipefail
          FEATURE_BRANCH="feat/vibe-now-controls-overlay-v0.2"
          EXPECTED_HEAD="cc0d5c242f566018d42fcb0b8502f7cc3d1af7e2"
          SOURCE_PATCH="build-inputs/v0.2/compiler-fixes.patch"
          PATCH="/tmp/vibenow-compiler-fixes.patch"

          echo "40b1c100061b75b1d3edb334c581223297a1c592f23e9f7716c9a974ecbd3ad3  ${SOURCE_PATCH}" | sha256sum --check --strict
          cp "${SOURCE_PATCH}" "${PATCH}"
          echo "40b1c100061b75b1d3edb334c581223297a1c592f23e9f7716c9a974ecbd3ad3  ${PATCH}" | sha256sum --check --strict

          git fetch origin "refs/heads/${FEATURE_BRANCH}"
          ACTUAL_HEAD="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          git checkout --detach "$ACTUAL_HEAD"

          git apply --check --whitespace=error-all "$PATCH"
          git apply --index --whitespace=error-all "$PATCH"
          git diff --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 2
          grep -q 'stopSegmentAfterUnexpectedStart()' android/app/src/main/java/app/setlog/capture/SetLogViewModel.kt
          grep -q 'return isRunning ? .green : .gray' ios/SetLogCamera/UI/CameraScreen.swift

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: resolve Android listener initialization and iOS status typing"
          git push \
            --force-with-lease="refs/heads/${FEATURE_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${FEATURE_BRANCH}"
