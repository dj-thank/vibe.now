name: Bootstrap SetLog source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore checksum-pinned Android and iOS sources
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="e3d63c9664487ca27e3f4dbe2044e1e63e8d1ca6"
          BASE="https://raw.githubusercontent.com/dj-thank/Behonest/${SOURCE_COMMIT}"
          WORK=/tmp/setlog-import
          rm -rf "$WORK"
          mkdir -p "$WORK/android-parts" "$WORK/ios-parts" "$WORK/android" "$WORK/ios"

          for part in 00 01 02 03 04; do
            curl --fail --silent --show-error --location \
              "$BASE/build-inputs/setlog-20260829/source.part.$part" \
              --output "$WORK/android-parts/source.part.$part"
          done
          cat "$WORK"/android-parts/source.part.* | base64 --decode > "$WORK/android.tar.xz"
          echo "b9e7671991ce55a383c9ae4e1866cc02bd73400250e5e9a33beb4fa6d4164539  $WORK/android.tar.xz" | sha256sum --check --strict
          tar -xJf "$WORK/android.tar.xz" -C "$WORK/android"
          test -f "$WORK/android/android/settings.gradle.kts"

          for part in 00 01 02 03 04 05 06 07; do
            curl --fail --silent --show-error --location \
              "$BASE/build-inputs/setlog-ios-20260829/source.part.$part" \
              --output "$WORK/ios-parts/source.part.$part"
          done
          cat "$WORK"/ios-parts/source.part.* | base64 --decode > "$WORK/ios.tar.xz"
          echo "aa17265e1a618cbc314f3cf51a361815a4a5c33805927e0caf305aee26e96141  $WORK/ios.tar.xz" | sha256sum --check --strict
          tar -xJf "$WORK/ios.tar.xz" -C "$WORK/ios"
          test -f "$WORK/ios/ios/SetLogCamera.xcworkspace/contents.xcworkspacedata"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/setlog-import/ios/ios/SetLogCamera/UI/CameraRootView.swift')
          source = path.read_text()
          source = source.replace('                        body: String(localized: "guide.', '                        detail: String(localized: "guide.')
          source = source.replace(
              '    let body: String\n    let symbol: String\n\n    var body: some View {',
              '    let detail: String\n    let symbol: String\n\n    var body: some View {'
          )
          source = source.replace('                Text(body)\n', '                Text(detail)\n')
          if 'let detail: String' not in source or 'Text(detail)' not in source:
              raise SystemExit('GuideRow source correction failed')
          path.write_text(source)
          PY

          rm -rf android ios
          cp -a "$WORK/android/android" ./android
          cp -a "$WORK/ios/ios" ./ios

          test -f android/app/src/main/java/app/setlog/capture/MainActivity.kt
          test -f ios/SetLogCamera/App/SetLogCameraApp.swift
          test -f ios/SetLogCamera/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Commit imported source and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android ios .github/workflows/bootstrap-source.yml
          git commit -m "feat: import SetLog Camera Android and iOS sources"
          git push origin HEAD:main
